source = mocha.conf

$accent = $lavender
$accentAlpha = $lavenderAlpha
$font = JetBrainsMono Nerd Font

# GENERAL
general {
  hide_cursor = true
}

# BACKGROUND
background {
  monitor =
  path = $HOME/.wallpaper/3.jpeg
  blur_size = 6
  blur_passes = 3
  color = $base
}

# TIME
label {
  monitor =
  text = $TIME
  color = $text
  font_size = 86
  font_family = $font
  position = -30, 0
  halign = right
  valign = top
}

# DATE
label {
  monitor =
  text = cmd[update:43200000] date +"%m/%d/%y"
  color = $text
  font_size = 24
  font_family = $font
  position = -130, -130
  halign = right
  valign = top
}

# INPUT FIELD
input-field {
  monitor =
  size = 290, 50
  outline_thickness = 2
  rounding = 10
  dots_size = 0.2
  dots_spacing = 0.2
  dots_center = true
  outer_color = $accent
  inner_color = $surface0
  font_color = $text
  fade_on_empty = false
  placeholder_text = <span foreground="##$textAlpha">Logged in as <span foreground="##$accentAlpha">$USER</span></span>
  hide_input = false
  check_color = $accent
  fail_color = $red
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
  capslock_color = $yellow
  position = 0, -40
  halign = center
  valign = center
}
