source = $HOME/.config/hypr/mocha.conf


################
### MONITORS ###
################

monitor=,1920x1080@60,0x0,1
# monitor=,2160x1440@60,0x0,1.50


###################
### MY PROGRAMS ###
###################

$terminal = alacritty
$fileManager = nautilus
$browser = firefox
$menu = fuzzel
# $menu = wofi --hide-scroll --show drun --style $HOME/.config/wofi/style1.css
$powerMenu = wlogout -b 4 -m 400
# $powerMenu = wlogout -b 4 -L 200 -R 200 -T 350 -B 350


#################
### AUTOSTART ###
#################

exec-once = systemctl --user start hyprpolkitagent
exec-once = hyprpaper & waybar & hypridle
exec-once = nm-applet --indicator & blueman-applet &
exec-once = $browser


#############################
### ENVIRONMENT VARIABLES ###
#############################

env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct


#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 2
    gaps_out = 4
    float_gaps = 4

    border_size = 2

    col.active_border = $lavender
    col.inactive_border = $overlay0

    resize_on_border = true
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

decoration {
    rounding = 10

    active_opacity = 0.9
    inactive_opacity = 0.9
    fullscreen_opacity = 0.9

    shadow {
        enabled = false
    }

    blur {
        enabled = true
        size = 6
        passes = 3

	    new_optimizations = true
	    xray = true
    }
}

animations {
    enabled = false
}

dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vrr = 0
}

xwayland {
    force_zero_scaling = true
}


#############
### INPUT ###
#############

input {
    kb_layout = us, ru
    kb_variant =
    kb_model =
    kb_options = grp:alt_shift_toggle
    kb_rules =

    follow_mouse = 1

    sensitivity = -0.5 # -1.0 - 1.0, 0 means no modification.

    accel_profile = flat
    # force_no_accel = true

    touchpad {
        natural_scroll = true
    }
}

# gestures {
#     workspace_swipe = false
# }

device {
    name = logitech-g304-1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, R, exec, $menu
bind = $mainMod, X, exec, $powerMenu
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, O, exec, hyprlock
bind = $mainMod, P, exec, hyprpicker

bind = $mainMod, W, killactive
bind = $mainMod, D, exit
bind = $mainMod, T, togglefloating
bind = $mainMod, F, fullscreen
bind = $mainMod SHIFT, F, fullscreen, 1
bind = $mainMod, C, centerwindow

# bind = $mainMod, P, pseudo, # dwindle
# bind = $mainMod, J, togglesplit, # dwindle

# Move focus
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, tab, cyclenext

# Move windows
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# Swap windows
#bind = $mainMod ALT, H, swapwindow, l
#bind = $mainMod ALT, L, swapwindow, r
#bind = $mainMod ALT, K, swapwindow, u
#bind = $mainMod ALT, J, swapwindow, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
# bind = $mainMod, 8, workspace, 8
# bind = $mainMod, 9, workspace, 9
# bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
# bind = $mainMod SHIFT, 8, movetoworkspace, 8
# bind = $mainMod SHIFT, 9, movetoworkspace, 9
# bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e-1
bind = $mainMod, mouse_up, workspace, e+1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous


##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule = workspace 2, match:class firefox

windowrule = opacity 1.0 override 1.0 override 1.0 override, match:class firefox
windowrule = no_blur on, match:class firefox
windowrule = opacity 1.0 override 1.0 override 1.0 override, match:class wofi
windowrule = no_blur on, match:class wofi
windowrule = opacity 1.0 override 1.0 override 1.0 override, match:class mpv
windowrule = no_blur on, match:class mpv

layerrule = blur on, match:namespace logout_dialog

windowrule {
    # Ignore maximize requests from all apps.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}
