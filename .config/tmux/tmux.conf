unbind-key -a -T root

set -g default-terminal "tmux-256color"
set -as terminal-features ",alacritty*:RGB"
set -g set-clipboard on
set -g mode-keys vi
set -g mouse on

set -g history-limit 10000

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set -s escape-time 0

set -g status-position bottom
# set -g pane-border-lines "double"

set -g @bg "#181825"
set -g @fg "#6c7086"
set -g @text "#cdd6f4"
set -g @base "#1e1e2e"
set -g @lavender "#b4befe"
set -g @mauve "#cba6f7"
set -g @red "#f38ba8"

set -g status-right ""
set -g status-left ""

set -gF status-style "bg=#{@bg},fg=#{@fg}"
set -gF message-style "bg=#{@bg},fg=#{@red}"

set -gF window-status-format "#[bg=#{@fg},fg=#{@text}] ##I:##W "
set -gF window-status-current-format "#[bg=#{@mauve},fg=#{@base}] ##I:##W "

set -g pane-active-border-style "fg=#{@lavender}"
set -g pane-border-style "fg=#{@fg}"

bind -n M-r source-file $HOME/.config/tmux/tmux.conf \; display "Config reloaded..."
bind -n M-s choose-tree -s

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

bind -n M-b split-window -v
bind -n M-v split-window -h

bind -n M-q new-window
bind -n M-w kill-pane
bind -n M-c kill-window
bind -n M-d detach
